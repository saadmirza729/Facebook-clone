<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

    <header>
        <nav>
            <div class="nav-left">
                <div class="logo">
                    <img src="./assets/pics/Facebook Logo.png" alt="">
                </div>
                <div class="input-nav">
                    <i class=" search-icon fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search Facebook">
                </div>
            </div>
            <div class="nav-mid">

                <i class=" icon-1 fa-solid fa-house"></i>
                <i class=" icon-1 fa-solid fa-circle-play"></i>
                <i class=" icon-1 fa-solid fa-store"></i>
                <i class=" icon-1 fa-solid fa-people-group"></i>
                <i class=" icon-1 fa-solid fa-gamepad"></i>
            </div>
            <div class="nav-right">

                <i class=" icon-2 fa-solid fa-bars"></i>
                <i class=" icon-2 fa-brands fa-facebook-messenger"></i>
                <i class=" icon-2 fa-solid fa-bell"></i>

                <div class="profile-img">
                    <img src="./assets/pics/profile pic.jpg" alt="">
                </div>
            </div>
        </nav>
    </header>

    <main>

        <div class="main-left">
            <div class="side-name1">
                <img src="./assets/pics/profile pic.jpg" alt="">
                <p>Saad Mirza</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-brands fa-meta"></i>
                <p>Meta AI</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-user-group"></i>
                <p>Friends</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <p>Memories</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-bookmark"></i>
                <p>Saved</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-people-group"></i>
                <p>Groups</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-play"></i>
                <p>Video</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-store"></i>
                <p>Marketplace</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-square-rss"></i>
                <p>Feeds</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-calendar-days"></i>
                <p>Events</p>
            </div>
            <div class="side-name1 side-icon1">
                <i class="fa-solid fa-chart-simple"></i>
                <p>Ads Manager</p>
            </div>

        </div>
        <div class="main-mid">
            <div class="uploads">
                <div class="status-logo">
                    <img src="./assets/pics/profile pic.jpg" alt="">
                </div>
                <input type="text" placeholder="What's on your mind?" class="mid-input" id="post">
                <div class="info1">
                    <div class="mid-icon1 icon-i"><i class="fa-solid fa-video"></i>
                    <p>Live video</p></div>
                    <div class="mid-icon2 icon-i"><i class="fa-solid fa-images"></i>
                    <p>Photo/video</p></div>
                    <div class="mid-icon3 icon-i"><i class="fa-solid fa-face-smile"></i>
                    <p>Feeling/activity</p></div>
                </div>
            </div>
        </div>
        <div class="main-right">
            <div class="contacts">
                <p>Contacts</p>
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-ellipsis"></i>
            </div>

        </div>
    </main>


    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
